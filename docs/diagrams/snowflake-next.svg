<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="890" fill="#ffffff"/>

  <text class="title" x="40" y="52">Snowflake - worker id and NextSnowflake()</text>
  <text class="subtitle" x="40" y="78">The worker id is resolved once per process; every call then reads the clock under a lock and packs the id.</text>

  <text class="label" x="40" y="122">Once per process, on the first Snowflake id</text>

  <!-- first call -->
  <rect class="step" x="40" y="164" width="170" height="72" rx="14"/>
  <text class="label" x="125" y="194" text-anchor="middle">First id</text>
  <text class="code" x="125" y="218" text-anchor="middle">NextSnowflake()</text>

  <path class="flow" d="M210,200 L268,200"/>

  <polygon class="decision" points="360,144 450,200 360,256 270,200"/>
  <text class="code" x="360" y="196" text-anchor="middle">SnowflakeWorkerId</text>
  <text class="small" x="360" y="214" text-anchor="middle">set by Configure?</text>

  <path class="flow" d="M450,200 L498,200"/>
  <text class="edge" x="474" y="190" text-anchor="middle">no</text>

  <polygon class="decision" points="590,144 680,200 590,256 500,200"/>
  <text class="code" x="590" y="196" text-anchor="middle">ORIONKEY_WORKER_ID</text>
  <text class="small" x="590" y="214" text-anchor="middle">is 0..1023?</text>

  <path class="flow" d="M680,200 L728,200"/>
  <text class="edge" x="704" y="190" text-anchor="middle">no</text>

  <rect class="step" x="730" y="160" width="200" height="80" rx="14"/>
  <text class="label" x="830" y="188" text-anchor="middle">Machine-name hash</text>
  <text class="small" x="830" y="208" text-anchor="middle">FNV-1a, masked to 0..1023</text>
  <text class="small" x="830" y="226" text-anchor="middle">+ one-time Trace warning</text>

  <path class="flow" d="M360,256 L360,338"/>
  <text class="edge" x="372" y="302">yes</text>
  <path class="flow" d="M590,256 L590,338"/>
  <text class="edge" x="602" y="302">yes</text>
  <path class="flow" d="M830,240 L830,338"/>

  <rect class="step" x="270" y="340" width="640" height="70" rx="14"/>
  <text class="code" x="590" y="370" text-anchor="middle">new SnowflakeIdGenerator(workerId, SnowflakeEpoch)</text>
  <text class="small" x="590" y="394" text-anchor="middle">epoch defaults to 2025-01-01 UTC; the generator is cached for the process</text>

  <path class="flow alt" d="M910,375 L958,375"/>
  <rect class="fail" x="960" y="335" width="200" height="80" rx="14"/>
  <text class="label" x="1060" y="362" text-anchor="middle">Worker id rejected</text>
  <text class="small" x="1060" y="382" text-anchor="middle">explicit id outside 0..1023</text>
  <text class="small" x="1060" y="402" text-anchor="middle">ArgumentOutOfRangeException</text>

  <text class="label" x="40" y="460">Every call, under a lock</text>
  <text class="code" x="400" y="460">SnowflakeIdGenerator.Next()</text>

  <path class="flow" d="M360,410 L360,482"/>

  <!-- per call -->
  <polygon class="decision" points="360,484 450,540 360,596 270,540"/>
  <text class="code" x="360" y="536" text-anchor="middle">now &lt; last</text>
  <text class="small" x="360" y="554" text-anchor="middle">clock went back?</text>

  <path class="flow alt" d="M360,596 L360,648"/>
  <text class="edge" x="372" y="628">yes</text>
  <rect class="fail" x="250" y="650" width="220" height="72" rx="14"/>
  <text class="label" x="360" y="680" text-anchor="middle">OrionKeyClockException</text>
  <text class="small" x="360" y="702" text-anchor="middle">no id is generated</text>

  <path class="flow" d="M450,540 L498,540"/>
  <text class="edge" x="474" y="530" text-anchor="middle">no</text>

  <polygon class="decision" points="590,484 680,540 590,596 500,540"/>
  <text class="code" x="590" y="536" text-anchor="middle" style="font-variant-ligatures: none">now == last</text>
  <text class="small" x="590" y="554" text-anchor="middle">same millisecond?</text>

  <path class="flow" d="M680,540 L728,540"/>
  <text class="edge" x="704" y="530" text-anchor="middle">yes</text>
  <rect class="step" x="730" y="504" width="170" height="72" rx="14"/>
  <text class="code" x="815" y="536" text-anchor="middle">sequence + 1</text>
  <text class="small" x="815" y="558" text-anchor="middle">12 bits, wraps at 4096</text>

  <path class="flow" d="M815,576 L815,608"/>
  <polygon class="decision" points="815,610 900,660 815,710 730,660"/>
  <text class="small" x="815" y="656" text-anchor="middle">wrapped</text>
  <text class="small" x="815" y="674" text-anchor="middle">to 0?</text>

  <path class="flow" d="M900,660 L948,660"/>
  <text class="edge" x="924" y="650" text-anchor="middle">yes</text>
  <rect class="step" x="950" y="624" width="210" height="72" rx="14"/>
  <text class="label" x="1055" y="654" text-anchor="middle">Wait for next ms</text>
  <text class="code" x="1055" y="678" text-anchor="middle">WaitNextMillis</text>

  <path class="flow" d="M590,596 L590,648"/>
  <text class="edge" x="602" y="628">no: new ms</text>
  <rect class="step" x="500" y="650" width="180" height="72" rx="14"/>
  <text class="code" x="590" y="690" text-anchor="middle">sequence = 0</text>

  <path class="flow" d="M590,722 L590,778"/>
  <path class="flow" d="M815,710 L815,778"/>
  <text class="edge" x="827" y="750">no</text>
  <path class="flow" d="M1055,696 L1055,778"/>

  <rect class="ok" x="500" y="780" width="660" height="80" rx="14"/>
  <text class="label" x="830" y="810" text-anchor="middle">Return the id; remember now as last</text>
  <text class="code" x="830" y="836" text-anchor="middle" style="font-variant-ligatures: none">(now - epoch) &lt;&lt; 22 | workerId &lt;&lt; 12 | sequence</text>

  <rect class="note" x="40" y="780" width="430" height="80" rx="10"/>
  <text class="small" x="58" y="808">Ids are unique only while every running instance</text>
  <text class="small" x="58" y="830">has its own worker id. The machine-name hash is not</text>
  <text class="small" x="58" y="850">unique across containers on one host.</text>
</svg>
